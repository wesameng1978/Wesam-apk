name: WISSAM GYM Chest Demo Build

on:
  push:
    branches: ["feature/wissam-gym-chest-demo"]
  pull_request:
    branches: ["main", "feature/wissam-gym-chest-demo"]

jobs:
  build-wissam-gym:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: wissam-gym
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Make Gradle executable
        run: chmod +x ./gradlew
      - name: Build debug APK and release AAB
        run: ./gradlew assembleDebug bundleRelease --no-daemon
      - name: Upload WISSAM GYM APK
        uses: actions/upload-artifact@v4
        with:
          name: wissam-gym-chest-demo-apk
          path: wissam-gym/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload WISSAM GYM AAB
        uses: actions/upload-artifact@v4
        with:
          name: wissam-gym-chest-demo-aab
          path: wissam-gym/app/build/outputs/bundle/release/app-release.aab
